<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhishDetect — Live Feed</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #FAF7F2;
      --surface: #FFFFFF;
      --border:  #E8D8C4;
      --text:    #2C1A0A;
      --sub:     #6B4A32;
      --muted:   #9E8068;
      --accent:  #C05E1A;
      --legit:   #0F7A50;
      --phish:   #B03010;
      --ai:      #6B21A8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky; top: 0; z-index: 10;
    }
    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-area img { height: 30px; width: auto; }
    .feed-label {
      font-size: 11px; color: var(--muted); font-weight: 500;
      padding-left: 10px; border-left: 1px solid var(--border);
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .dot.live { background: var(--legit); animation: blink 2s step-end infinite; }
    .dot.err  { background: var(--phish); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .clear-btn {
      padding: 4px 12px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 4px;
      color: var(--sub); font-size: 11px; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .clear-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Stats ── */
    .stats {
      display: flex; border-bottom: 1px solid var(--border);
      background: var(--surface); padding: 0 20px;
    }
    .stat { padding: 11px 20px 11px 0; margin-right: 20px; border-right: 1px solid var(--border); }
    .stat:last-child { border-right: none; margin-right: 0; }
    .stat-val { font-family: 'Courier New', monospace; font-size: 20px; font-weight: 600; line-height: 1; }
    .stat-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-top: 3px; }
    .c-total { color: var(--accent); }
    .c-legit { color: var(--legit); }
    .c-phish { color: var(--phish); }
    .c-ai    { color: var(--ai); }

    /* ── Feed list ── */
    .feed { padding: 14px 20px; max-width: 820px; margin: 0 auto; }

    .empty { text-align: center; padding: 5rem 1rem; color: var(--muted); }
    .empty img { width: 56px; opacity: .2; margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto; }
    .empty p { font-size: .85rem; line-height: 1.7; }

    /* ── Entry card ── */
    .entry {
      display: grid;
      grid-template-columns: 4px 1fr auto;
      gap: 0 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 7px;
      overflow: hidden;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:none; } }
    .entry-stripe { grid-row: 1; border-radius: 6px 0 0 6px; }
    .entry.legit .entry-stripe { background: var(--legit); }
    .entry.phish .entry-stripe { background: var(--phish); }
    .entry.ai    .entry-stripe { background: var(--ai); }
    .entry-body { padding: 9px 0; }
    .entry-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .entry-verdict { font-weight: 700; font-size: 12px; }
    .entry.legit .entry-verdict { color: var(--legit); }
    .entry.phish .entry-verdict { color: var(--phish); }
    .entry.ai    .entry-verdict { color: var(--ai); }
    .entry-conf { font-family: 'Courier New', monospace; font-size: 11px; color: var(--muted); }
    .risk-pill {
      font-family: 'Courier New', monospace; font-size: 9px;
      text-transform: uppercase; letter-spacing: .05em;
      padding: 2px 6px; border-radius: 3px; border: 1px solid;
    }
    .risk-low      { color: var(--legit); border-color: rgba(15,122,80,.3); background: rgba(15,122,80,.07); }
    .risk-medium   { color: #9A5000;      border-color: rgba(154,80,0,.3);  background: rgba(154,80,0,.07); }
    .risk-high     { color: var(--phish); border-color: rgba(176,48,16,.3); background: rgba(176,48,16,.07); }
    .risk-critical { color: var(--ai);    border-color: rgba(107,33,168,.3);background: rgba(107,33,168,.07); }
    .entry-subject {
      margin-top: 3px; font-size: 12px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px;
    }
    .entry-sender {
      margin-top: 1px; font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px;
    }
    .entry-sigs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .sig { font-size: 10px; padding: 1px 7px; border-radius: 3px; }
    .sig-warn { background: rgba(176,48,16,.1); color: var(--phish); }
    .sig-ok   { background: rgba(15,122,80,.1); color: var(--legit); }
    .entry-ts {
      padding: 9px 14px 0 0; font-family: 'Courier New', monospace;
      font-size: 9px; color: var(--muted); white-space: nowrap; align-self: start;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-area">
      <img id="logoImg" src="logo.png" alt="PhishDetect AI">
      <span class="feed-label">Live Feed</span>
    </div>
    <div class="header-right">
      <div class="status">
        <div class="dot" id="dot"></div>
        <span id="statusText">Connecting…</span>
      </div>
      <button class="clear-btn" onclick="clearFeed()">Clear</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-val c-total" id="s-total">0</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-val c-legit" id="s-legit">0</div><div class="stat-lbl">Legitimate</div></div>
    <div class="stat"><div class="stat-val c-phish" id="s-phish">0</div><div class="stat-lbl">Phishing</div></div>
    <div class="stat"><div class="stat-val c-ai"    id="s-ai">0</div><div class="stat-lbl">AI Phishing</div></div>
  </div>

  <div class="feed" id="feed">
    <div class="empty" id="empty">
      <img id="emptyLogo" src="logo.png" alt="">
      <p>No scans yet<br>Open an email in Gmail and click <strong>Analyse</strong></p>
    </div>
  </div>

  <script>
    const DEFAULT_API = "http://localhost:8000";

    // ── Detect context: extension page vs served directly from FastAPI ────────
    const IS_EXTENSION = window.location.protocol === "chrome-extension:";

    // Fix logo paths when served from FastAPI (relative 'logo.png' won't work)
    if (!IS_EXTENSION) {
      document.getElementById("logoImg").src  = "/logo.png";
      document.getElementById("emptyLogo").src = "/logo.png";
    }

    let counts = { total: 0, legit: 0, phish: 0, ai: 0 };
    let es = null;

    // ── Get the stream URL based on context ──────────────────────────────────
    async function getStreamUrl() {
      if (!IS_EXTENSION) {
        // Served from localhost:8000 — same-origin, no permissions needed
        return window.location.origin + "/scans/stream";
      }
      // Extension page — read configured API from storage
      return new Promise(resolve => {
        chrome.storage.sync.get("apiUrl", ({ apiUrl }) =>
          resolve((apiUrl || DEFAULT_API) + "/scans/stream")
        );
      });
    }

    async function connect() {
      if (es) { es.close(); es = null; }
      const url = await getStreamUrl();
      setStatus("connecting");

      es = new EventSource(url);

      es.onopen = () => setStatus("live");

      es.onmessage = (e) => {
        if (!e.data) return;
        try {
          const entry = JSON.parse(e.data);
          // Filter internal control events
          if (entry.type === "connected" || entry.type === "ping") return;
          addEntry(entry);
        } catch {}
      };

      es.onerror = () => {
        setStatus("error");
        es.close();
        es = null;
        setTimeout(connect, 4000);
      };
    }

    function addEntry(entry) {
      document.getElementById("empty")?.remove();

      const isAI    = entry.prediction.includes("ai");
      const isPhish = entry.prediction.includes("phishing");
      const cls     = isAI ? "ai" : isPhish ? "phish" : "legit";
      const label   = isAI ? "AI-Generated Phishing" : isPhish ? "Traditional Phishing" : "Legitimate";
      const riskKey = (entry.risk || "low").toLowerCase().replace(" ", "-");

      counts.total++;
      if (isAI)         counts.ai++;
      else if (isPhish) counts.phish++;
      else              counts.legit++;
      updateStats();

      const ts = new Date(entry.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

      const sigHtml = (entry.signals || []).length
        ? `<div class="entry-sigs">${entry.signals.slice(0, 3).map(s =>
            `<span class="sig ${s.weight > 0 ? "sig-warn" : "sig-ok"}">${esc(s.label)}</span>`
          ).join("")}</div>`
        : "";

      const card = document.createElement("div");
      card.className = `entry ${cls}`;
      card.innerHTML = `
        <div class="entry-stripe"></div>
        <div class="entry-body">
          <div class="entry-top">
            <span class="entry-verdict">${label}</span>
            <span class="entry-conf">${entry.confidence}%</span>
            <span class="risk-pill risk-${riskKey}">${entry.risk}</span>
          </div>
          <div class="entry-subject">${esc(entry.subject)}</div>
          <div class="entry-sender">${esc(entry.sender)}</div>
          ${sigHtml}
        </div>
        <div class="entry-ts">${ts}</div>
      `;

      const feed = document.getElementById("feed");
      feed.insertBefore(card, feed.firstChild);
    }

    function updateStats() {
      document.getElementById("s-total").textContent = counts.total;
      document.getElementById("s-legit").textContent = counts.legit;
      document.getElementById("s-phish").textContent = counts.phish;
      document.getElementById("s-ai").textContent    = counts.ai;
    }

    function clearFeed() {
      document.getElementById("feed").innerHTML = "";
      counts = { total: 0, legit: 0, phish: 0, ai: 0 };
      updateStats();
    }

    function setStatus(state) {
      document.getElementById("dot").className = "dot" + (state === "live" ? " live" : state === "error" ? " err" : "");
      document.getElementById("statusText").textContent =
        state === "live" ? "Live" : state === "error" ? "Reconnecting…" : "Connecting…";
    }

    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    connect();
  </script>
</body>
</html>
